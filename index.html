<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倉管驗收檢驗看板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f3f5; padding: 15px; font-family: "Microsoft JhengHei", sans-serif; }
        
        .header-bar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 搜尋欄 */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-input {
            border-radius: 50px; padding-left: 40px; border: 2px solid #ddd; transition: border-color 0.3s;
        }
        .search-input:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; }

        /* 分頁按鈕 */
        .nav-pills .nav-link {
            border-radius: 50px; padding: 10px 25px; font-weight: bold; color: #666;
            background-color: white; border: 1px solid #ddd; margin: 0 5px; transition: all 0.3s;
        }
        .nav-pills .nav-link.active#pills-raw-tab { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .nav-pills .nav-link.active#pills-finished-tab { background-color: #198754; color: white; border-color: #198754; }

        /* 摺疊卡片 */
        .accordion-item { border: none; margin-bottom: 12px; border-radius: 8px !important; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .accordion-button { font-size: 1.05rem; font-weight: bold; color: #444; background-color: #fff; }
        .accordion-button:not(.collapsed) { background-color: #e7f1ff; color: #0d6efd; box-shadow: none; }
        .finished-goods-section .accordion-button:not(.collapsed) { background-color: #d1e7dd; color: #0f5132; }

        /* 狀態標籤 */
        .status-badge { 
            padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; 
            display: inline-block; min-width: 65px; text-align: center;
        }
        .bg-pass { background-color: #d4efdf; color: #1e8449; }
        .bg-fail { background-color: #fadbd8; color: #c0392b; }
        .bg-wait { background-color: #fcf3cf; color: #b7950b; }

        .table th { background-color: #f8f9fa; color: #777; font-weight: 600; font-size: 0.9rem; }
        .table td { vertical-align: middle; font-size: 0.95rem; }
        .item-id { font-family: monospace; font-weight: bold; font-size: 1rem; color: #0d6efd; }
        .issue-text { color: #dc3545; font-weight: bold; font-size: 0.9rem; }

        /* 🔥 新增：序號欄位樣式 */
        .index-col { font-weight: bold; color: #6c757d; text-align: center; width: 50px; }
    </style>
</head>
<body>

    <div class="container-fluid" style="max-width: 1200px;">
        <div class="header-bar">
            <div>
                <h4 class="m-0 fw-bold">📦 倉管收貨檢驗看板</h4>
            </div>
            <div class="text-end">
                <div id="update-time" style="font-size: 0.9rem; opacity: 0.9;">更新中...</div>
                <small style="opacity: 0.7; font-size: 0.75rem;">Source: GitHub</small>
            </div>
        </div>

        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3 text-muted">正在同步檢驗資料...</p>
        </div>

        <div id="main-content" style="display: none;">
            
            <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="pills-raw-tab" data-bs-toggle="pill" data-bs-target="#pills-raw" type="button">
                        📦 原料進貨
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="pills-finished-tab" data-bs-toggle="pill" data-bs-target="#pills-finished" type="button">
                        🏭 成品生產
                    </button>
                </li>
            </ul>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" class="form-control form-control-lg search-input" placeholder="搜尋：料號、廠商、品名、批號、異常...">
            </div>

            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active" id="pills-raw">
                    <div class="accordion" id="accordionRaw"></div>
                </div>
                <div class="tab-pane fade finished-goods-section" id="pills-finished">
                    <div class="accordion" id="accordionFinished"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const apiURL = './data.json'; 

        function getQcNo(item) {
            return item.qcNo || item.qc_number || item.qcNumber || item.qc || item["QC單號"] || "-";
        }

        async function init() {
            try {
                const response = await fetch(apiURL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("無法讀取資料庫");
                
                const data = await response.json();
                
                const now = new Date();
                document.getElementById('update-time').innerText = 
                    `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                processData(data);

            } catch (error) {
                document.getElementById('loader').innerHTML = `<h5 class="text-danger">❌ 資料讀取失敗</h5><p>${error.message}</p>`;
            }
        }

        function processData(data) {
            if (!data || data.length === 0) {
                document.getElementById('loader').innerHTML = `<h5 class="text-warning">📭 目前沒有檢驗資料</h5>`;
                return;
            }

            let rawDataMap = {};
            let finishedDataMap = {};

            data.forEach(item => {
                let type = item.type || "";
                let dateStr = (item.date || "").substring(0, 10);
                let status = item.status || "";

                if (!type || !dateStr) return; 

                let record = {
                    id: item.id || "-",
                    vendor: item.vendor || "-",
                    name: item.name || "未知品項",
                    expiry: item.expiry || "",
                    batch: item.batch || "",
                    qcNo: getQcNo(item),
                    status: status,
                    issue: item.issue || ""
                };

                if (type.includes("原料")) {
                    if (!rawDataMap[dateStr]) rawDataMap[dateStr] = [];
                    rawDataMap[dateStr].push(record);
                } else if (type.includes("成品")) {
                    if (!finishedDataMap[dateStr]) finishedDataMap[dateStr] = [];
                    finishedDataMap[dateStr].push(record);
                }
            });

            // 這裡維持原樣，保留效期/批號的切換邏輯
            renderAccordion('accordionRaw', rawDataMap, '原料', '入貨日', '有效日期', 'expiry');
            renderAccordion('accordionFinished', finishedDataMap, '成品', '製造日', '批號', 'batch');

            enableSearch();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function renderAccordion(elementId, dataMap, label, datePrefix, colLabel, dataKey) {
            const container = document.getElementById(elementId);
            const sortedDates = Object.keys(dataMap).sort().reverse(); 

            if (sortedDates.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-muted">無${label}檢驗紀錄</div>`;
                return;
            }

            let html = "";
            sortedDates.forEach((date, index) => {
                let items = dataMap[date];
                
                let collapseClass = "collapse"; 
                let buttonClass = "accordion-button collapsed";
                let countBadge = `<span class="badge bg-secondary ms-2 rounded-pill">${items.length} 筆</span>`;

                // 🔥 修改重點：加入 (item, i) 參數，i 就是從 0 開始的序號
                let rows = items.map((item, i) => {
                    let s = item.status;
                    let badgeClass = "bg-wait"; 
                    if (s.includes("合格") && !s.includes("不合格")) badgeClass = "bg-pass";
                    if (s.includes("不合格")) badgeClass = "bg-fail";

                    let issueDisplay = item.issue ? `<span class="issue-text">${item.issue}</span>` : "";
                    let dynamicColValue = item[dataKey] || "-";

                    return `
                        <tr>
                            <td class="index-col">${i + 1}</td>
                            <td class="item-id">${item.id}</td>
                            <td class="d-none d-sm-table-cell">${item.vendor}</td>
                            <td>${item.name}</td>
                            <td>${dynamicColValue}</td>
                            <td>${item.qcNo}</td>
                            <td class="text-center"><span class="status-badge ${badgeClass}">${s}</span></td>
                            <td>${issueDisplay}</td>
                        </tr>
                    `;
                }).join("");

                html += `
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="heading-${elementId}-${index}">
                            <button class="${buttonClass}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${elementId}-${index}">
                                📅 ${datePrefix}: ${date} ${countBadge}
                            </button>
                        </h2>
                        <div id="collapse-${elementId}-${index}" class="accordion-collapse ${collapseClass}" data-bs-parent="#${elementId}">
                            <div class="accordion-body p-0">
                                <table class="table table-hover mb-0 table-striped">
                                    <thead class="table-light">
                                        <tr>
                                            <th width="5%" class="text-center">#</th>
                                            <th width="12%">料號</th>
                                            <th width="18%" class="d-none d-sm-table-cell">廠商</th>
                                            <th width="18%">品名</th>
                                            <th width="13%">${colLabel}</th>
                                            <th width="12%">QC單號</th>
                                            <th width="10%" class="text-center">判定</th>
                                            <th width="12%">異常狀況</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function enableSearch() {
            const searchInput = document.getElementById('globalSearch');
            
            searchInput.addEventListener('input', function(e) {
                const keyword = e.target.value.toLowerCase().trim();
                const allAccordionItems = document.querySelectorAll('.accordion-item');

                allAccordionItems.forEach(accItem => {
                    const rows = accItem.querySelectorAll('tbody tr');
                    let hasMatch = false;

                    rows.forEach(row => {
                        const text = row.innerText.toLowerCase();
                        if (text.includes(keyword)) {
                            row.style.display = '';
                            hasMatch = true;
                        } else {
                            row.style.display = 'none';
                        }
                    });

                    const collapseDiv = accItem.querySelector('.accordion-collapse');
                    const btn = accItem.querySelector('.accordion-button');

                    if (hasMatch) {
                        accItem.style.display = '';
                        if (keyword !== "") {
                            collapseDiv.classList.add('show');
                            btn.classList.remove('collapsed');
                            btn.setAttribute('aria-expanded', 'true');
                        }
                    } else {
                        accItem.style.display = 'none';
                    }

                    if (keyword === "") {
                         collapseDiv.classList.remove('show');
                         btn.classList.add('collapsed');
                         btn.setAttribute('aria-expanded', 'false');
                         rows.forEach(r => r.style.display = '');
                    }
                });
            });
        }

        init();
    </script>
</body>
</html>
